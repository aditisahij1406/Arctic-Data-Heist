<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arctic Data Heist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START SCREEN -->
    <div id="startScreen">
        <div class="snow">❄ ❄ ❄ ❄ ❄</div>

        <h1>ARCTIC DATA HEIST</h1>

        <h2>RECOVER THE LOST RESEARCH</h2>

        <p>
            Three animal files have been corrupted.<br>
            Find the animals and recover their data.
        </p>

        <button id="startButton">START EXPEDITION</button>

        <div class="controls">
            WASD — MOVE &nbsp; | &nbsp; MOUSE — LOOK &nbsp; | &nbsp; E — INVESTIGATE
        </div>
    </div>


    <!-- GAME HUD -->
    <div id="hud">

        <div class="gameTitle">
            ❄ ARCTIC DATA HEIST
        </div>

        <div>
            DATA:
            <span id="data">0</span>/3
        </div>

        <div>
            SCORE:
            <span id="score">0</span>
        </div>

        <div>
            TIME:
            <span id="time">90</span>
        </div>

    </div>


    <!-- CROSSHAIR -->
    <div id="crosshair">+</div>


    <!-- INTERACTION MESSAGE -->
    <div id="interaction"></div>


    <!-- PUZZLE -->
    <div id="puzzle">

        <div id="puzzleCard">

            <div id="animalName"></div>

            <h2 id="question"></h2>

            <div id="answers"></div>

            <div id="fact"></div>

            <button id="continueButton">
                CONTINUE
            </button>

        </div>

    </div>


    <!-- FINISH -->
    <div id="gameOver">

        <h1>MISSION COMPLETE</h1>

        <p id="finalScore"></p>

        <button onclick="location.reload()">
            PLAY AGAIN
        </button>

    </div>


    <!-- THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- OUR GAME -->
    <script src="game.js"></script>

</body>
</html>
